name: CMake Build and Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"

  pull_request:
    branches:
      - master

permissions:
  contents: write


jobs:

  # ============================================================
  # Windows x64
  # ============================================================
  windows-x64:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake
          -S .
          -B build
          -A x64
          -DCMAKE_CXX_STANDARD=20

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        working-directory: build
        run: ctest --build-config Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist

          Copy-Item `
            build/Release/zbtca-cli.exe `
            dist/zbtca-cli.exe

          Compress-Archive `
            -Path dist/zbtca-cli.exe `
            -DestinationPath zbtca-cli-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zbtca-cli-windows-x64
          path: zbtca-cli-windows-x64.zip


  # ============================================================
  # Windows x86 / 32-bit
  # ============================================================
  windows-x86:
    name: Windows x86
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake
          -S .
          -B build
          -A Win32
          -DCMAKE_CXX_STANDARD=20

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        working-directory: build
        run: ctest --build-config Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist

          Copy-Item `
            build/Release/zbtca-cli.exe `
            dist/zbtca-cli.exe

          Compress-Archive `
            -Path dist/zbtca-cli.exe `
            -DestinationPath zbtca-cli-windows-x86.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zbtca-cli-windows-x86
          path: zbtca-cli-windows-x86.zip


  # ============================================================
  # Linux x64
  # ============================================================
  linux-x64:
    name: Linux x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

      - name: Package
        run: |
          mkdir -p dist

          cp build/zbtca-cli \
             dist/zbtca-cli

          tar \
            -czf zbtca-cli-linux-x64.tar.gz \
            -C dist \
            zbtca-cli

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zbtca-cli-linux-x64
          path: zbtca-cli-linux-x64.tar.gz


  # ============================================================
  # Linux x86 / 32-bit
  # ============================================================
  linux-x86:
    name: Linux x86
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 32-bit toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update

          sudo apt-get install -y \
            gcc-multilib \
            g++-multilib

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_FLAGS=-m32 \
            -DCMAKE_CXX_FLAGS=-m32 \
            -DCMAKE_EXE_LINKER_FLAGS=-m32 \
            -DCMAKE_CXX_STANDARD=20

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

      - name: Package
        run: |
          mkdir -p dist

          cp build/zbtca-cli \
             dist/zbtca-cli

          tar \
            -czf zbtca-cli-linux-x86.tar.gz \
            -C dist \
            zbtca-cli

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zbtca-cli-linux-x86
          path: zbtca-cli-linux-x86.tar.gz


  # ============================================================
  # Linux ARM32 / ARMv7 hard-float
  # ============================================================
  linux-arm32:
    name: Linux ARM32
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM32 toolchain
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt-get update

          sudo apt-get install -y \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
            -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ \
            -DCMAKE_C_FLAGS="-march=armv7-a" \
            -DCMAKE_CXX_FLAGS="-march=armv7-a" \
            -DCMAKE_CXX_STANDARD=20

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        run: |
          mkdir -p dist

          cp build/zbtca-cli \
             dist/zbtca-cli

          tar \
            -czf zbtca-cli-linux-arm32.tar.gz \
            -C dist \
            zbtca-cli

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zbtca-cli-linux-arm32
          path: zbtca-cli-linux-arm32.tar.gz


  # ============================================================
  # Linux ARM64
  # ============================================================
  linux-arm64:
    name: Linux ARM64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

      - name: Package
        run: |
          mkdir -p dist

          cp build/zbtca-cli \
             dist/zbtca-cli

          tar \
            -czf zbtca-cli-linux-arm64.tar.gz \
            -C dist \
            zbtca-cli

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zbtca-cli-linux-arm64
          path: zbtca-cli-linux-arm64.tar.gz


  # ============================================================
  # macOS x64 / Intel
  # ============================================================
  macos-x64:
    name: macOS x64
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

      - name: Package
        run: |
          mkdir -p dist

          cp build/zbtca-cli \
             dist/zbtca-cli

          tar \
            -czf zbtca-cli-macos-x64.tar.gz \
            -C dist \
            zbtca-cli

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zbtca-cli-macos-x64
          path: zbtca-cli-macos-x64.tar.gz


  # ============================================================
  # macOS ARM64 / Apple Silicon
  # ============================================================
  macos-arm64:
    name: macOS ARM64
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

      - name: Package
        run: |
          mkdir -p dist

          cp build/zbtca-cli \
             dist/zbtca-cli

          tar \
            -czf zbtca-cli-macos-arm64.tar.gz \
            -C dist \
            zbtca-cli

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zbtca-cli-macos-arm64
          path: zbtca-cli-macos-arm64.tar.gz


  # ============================================================
  # GitHub Release
  # ============================================================
  release:
    name: Create GitHub Release

    if: startsWith(github.ref, 'refs/tags/v')

    needs:
      - windows-x64
      - windows-x86
      - linux-x64
      - linux-x86
      - linux-arm32
      - linux-arm64
      - macos-x64
      - macos-arm64

    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release-files

          find release \
            -type f \
            \( -name "*.zip" -o -name "*.tar.gz" \) \
            -exec cp {} release-files/ \;

          echo "Release files:"
          ls -lh release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
